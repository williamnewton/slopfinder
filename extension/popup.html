<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  /* The popup window itself can't be transparent, so the rounded look comes
     from an inner panel on a darker ground. */
  body {
    width: 300px;
    margin: 0;
    padding: 8px;
    background: #0d0c0a;
    color: #f5f2ea;
    font: 14px/1.5 system-ui, sans-serif;
  }
  .panel {
    background: #16140f;
    border: 1px solid #2a2620;
    border-radius: 14px;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 16px;
  }
  h1 { margin: 0; font-size: 15px; }
  h1 mark { background: #fcd34d; color: #1d1b17; border-radius: 3px; padding: 0 4px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid #211e18;
  }
  .row-label { font-weight: 600; font-size: 13px; }
  .row-sub { color: #a29b8d; font-size: 11.5px; }
  .count-wrap { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
  .count { color: #fcd34d; font-weight: 700; font-size: 18px; }
  .count-label { color: #fcd34d; font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }
  /* toggle */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .knob {
    position: absolute; inset: 0; cursor: pointer;
    background: #3a362e; border-radius: 999px; transition: background 0.15s;
  }
  .knob::before {
    content: ""; position: absolute; width: 16px; height: 16px;
    left: 3px; top: 3px; background: #f5f2ea; border-radius: 50%;
    transition: transform 0.15s;
  }
  .switch input:checked + .knob { background: #fcd34d; }
  .switch input:checked + .knob::before { transform: translateX(18px); background: #1d1b17; }
  /* expandable pattern list */
  details.patterns summary {
    list-style: none;
    cursor: pointer;
  }
  details.patterns summary::-webkit-details-marker { display: none; }
  .chev {
    color: #a29b8d;
    font-size: 11px;
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  details.patterns[open] .chev { transform: rotate(90deg); }
  #pattern-list {
    margin: 0;
    padding: 2px 16px 12px 32px;
    max-height: 176px;
    overflow-y: auto;
    font-size: 12px;
    color: #a29b8d;
  }
  #pattern-list li { margin: 3px 0; }
  #pattern-list li::marker { color: #fcd34d; }
  /* actions */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px dotted #4a4438;
  }
  button {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #3a362e;
    border-radius: 8px;
    background: #211e18;
    color: #f5f2ea;
    font: 600 11.5px system-ui, sans-serif;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  #reset { flex-basis: 100%; }
  #status { margin: 0; padding: 0 16px 10px; color: #a29b8d; font-size: 11.5px; min-height: 16px; }
  #status.error { color: #fca5a5; }
  footer { padding: 8px 16px 12px; border-top: 1px solid #211e18; font-size: 11px; color: #6e6a62; }
  footer a { color: #a29b8d; }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <h1>Slop <mark>Finder</mark></h1>
      <div class="count-wrap">
        <span class="count" id="page-count">–</span>
        <span class="count-label">on this page</span>
      </div>
    </header>
    <div class="row">
      <div>
        <div class="row-label">Auto-highlight</div>
        <div class="row-sub">Runs on every page as it loads</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="knob"></span>
      </label>
    </div>
    <details class="patterns">
      <summary class="row">
        <div>
          <div class="row-label">Patterns</div>
          <div class="row-sub" id="pattern-count"></div>
        </div>
        <span class="chev" aria-hidden="true">▶</span>
      </summary>
      <ul id="pattern-list"></ul>
    </details>
    <div class="actions">
      <button id="download" type="button">Download JSON</button>
      <button id="upload" type="button">Upload JSON</button>
      <button id="reset" type="button">Reset to defaults</button>
    </div>
    <p id="status"></p>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <footer>
      Patterns adapted from
      <a href="https://github.com/simonw/tools/blob/main/llm-cliche-highlighter.html" target="_blank" rel="noreferrer">Simon Willison's LLM cliché highlighter</a>.
      Runs locally; no network requests.
    </footer>
  </div>
  <script src="patterns.js"></script>
  <script src="popup.js"></script>
</body>
</html>
